<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Rumah + Bukti Foto/Kamera</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Form Input */
        .form-card {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background-color: white;
            width: 100%;
        }

        .photo-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #cbd5e0;
        }

        .photo-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            flex: 1;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        /* Area Kamera Live */
        #cameraArea {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
        }

        video {
            width: 100%;
            max-height: 250px;
            border-radius: 6px;
            background: #222;
        }

        #previewImage {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            display: none;
            object-fit: cover;
            margin-top: 5px;
        }

        /* List Items */
        ul {
            list-style: none;
        }

        li {
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info {
            cursor: pointer;
            flex: 1;
        }

        .title {
            font-weight: 600;
            font-size: 15px;
        }

        li.completed .title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .badge {
            font-size: 11px;
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        .proof-photo {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Tugas Rumah + Bukti Foto</h1>

        <div class="form-card">
            <input type="text" id="taskTitle" placeholder="Nama tugas (misal: Menyapu Dapur)...">
            
            <div class="input-row">
                <select id="taskCategory">
                    <option value="Dapur">🍳 Dapur</option>
                    <option value="Kamar">🛏️ Kamar</option>
                    <option value="Ruang Tamu">🛋️ Ruang Tamu</option>
                    <option value="Halaman">🌱 Halaman</option>
                </select>
            </div>

            <div class="photo-input-group">
                <label style="font-size: 12px; font-weight: 600; color: #475569;">📷 Bukti Pengerjaan (Opsional):</label>
                <div class="photo-buttons">
                    <button type="button" class="btn-secondary" onclick="startCamera()">📷 Ambil via Kamera</button>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Pilih dari Galeri</button>
                </div>

                <div id="cameraArea">
                    <video id="webcam" autoplay playsinline></video>
                    <button type="button" class="btn-secondary" style="background:#10b981;" onclick="takeSnap()">📸 Jepret Foto</button>
                </div>

                <img id="previewImage" alt="Preview Bukti">
            </div>

            <button class="btn-add" onclick="addTask()">+ Simpan Tugas</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('photoTasks')) || [];
        let currentPhotoBase64 = "";
        let stream = null;

        document.addEventListener('DOMContentLoaded', renderTasks);

        // Akses Kamera HP / WebCam
        async function startCamera() {
            const cameraArea = document.getElementById('cameraArea');
            const video = document.getElementById('webcam');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } // Mengutamakan kamera belakang HP
                });
                video.srcObject = stream;
                cameraArea.style.display = 'flex';
            } catch (err) {
                alert("Gagal mengaktifkan kamera. Pastikan memberikan izin akses kamera.");
            }
        }

        // Ambil Foto dari Kamera
        function takeSnap() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7); // Kompresi foto
            showPreview(currentPhotoBase64);

            // Matikan Kamera
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraArea').style.display = 'none';
        }

        // Ambil Foto dari File / Galeri
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhotoBase64 = e.target.result;
                    showPreview(currentPhotoBase64);
                };
                reader.readAsDataURL(file);
            }
        }

        function showPreview(src) {
            const img = document.getElementById('previewImage');
            img.src = src;
            img.style.display = 'block';
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCategory').value;

            if (!title) {
                alert('Nama tugas tidak boleh kosong!');
                return;
            }

            const newTask = {
                id: Date.now(),
                title: title,
                category: category,
                photo: currentPhotoBase64,
                completed: false,
                date: new Date().toLocaleString('id-ID')
            };

            tasks.push(newTask);
            localStorage.setItem('photoTasks', JSON.stringify(tasks));

            // Reset Form
            document.getElementById('taskTitle').value = '';
            document.getElementById('previewImage').style.display = 'none';
            currentPhotoBase64 = "";

            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => {
                if (t.id === id) t.completed = !t.completed;
                return t;
            });
            localStorage.setItem('photoTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('photoTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                listEl.innerHTML = '<li style="text-align:center; color:#94a3b8;">Belum ada tugas tercatat.</li>';
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                let photoHTML = task.photo 
                    ? `<img src="${task.photo}" class="proof-photo" alt="Bukti Foto">` 
                    : '<span style="font-size:12px; color:#94a3b8; italic;">Tidak ada foto bukti</span>';

                li.innerHTML = `
                    <div class="task-main">
                        <div class="info" onclick="toggleTask(${task.id})">
                            <div class="title">${task.completed ? '✅ ' : '⏳ '} ${task.title}</div>
                            <span class="badge">${task.category} • ${task.date}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">Hapus</button>
                    </div>
                    ${photoHTML}
                `;

                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
