<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensiklopedi Kuliner 38 Provinsi Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --brand: #c2410c;
            --brand-light: #fff7ed;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f17;
                --surface: #151c2c;
                --border: #1e293b;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --brand: #ea580c;
                --brand-light: #1c1917;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 1000px; }

        header { margin-bottom: 24px; text-align: center; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        
        .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .search-input, .select-input {
            padding: 12px 16px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 0.95rem; outline: none;
        }
        .search-input { flex: 2; min-width: 200px; }
        .select-input { flex: 1; min-width: 160px; }
        .search-input:focus, .select-input:focus { border-color: var(--brand); }

        .counter-badge {
            font-size: 0.85rem; font-weight: 700; color: var(--brand);
            background: var(--brand-light); padding: 8px 12px; border-radius: 8px; width: fit-content;
        }

        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--brand); }

        .card-img {
            width: 100%; height: 180px; object-fit: cover; background-color: var(--border);
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-region { font-size: 0.75rem; font-weight: 700; color: var(--brand); text-transform: uppercase; }
        .card-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0 8px 0; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; margin-top: auto; }

        .detail-view { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .detail-img {
            width: 100%; max-height: 380px; object-fit: cover; border-radius: var(--radius); margin: 16px 0;
        }

        .btn-back {
            background: none; border: none; color: var(--brand); font-weight: 700;
            font-size: 0.95rem; cursor: pointer; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px;
        }

        .portion-selector {
            display: flex; align-items: center; gap: 12px; background: var(--brand-light);
            padding: 10px 16px; border-radius: var(--radius); margin: 16px 0 24px 0; width: fit-content;
        }
        .portion-btn {
            background: var(--surface); border: 1px solid var(--border); width: 30px; height: 30px;
            border-radius: 6px; font-weight: 700; cursor: pointer; color: var(--text);
        }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-top: 24px; margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
        
        .ingredients-list { list-style: none; margin-bottom: 16px; }
        .ingredients-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }

        .steps-list { list-style: none; counter-reset: step-counter; }
        .steps-list li {
            position: relative; padding-left: 36px; margin-bottom: 16px;
            font-size: 0.95rem; line-height: 1.6; cursor: pointer;
        }
        .steps-list li::before {
            counter-increment: step-counter; content: counter(step-counter);
            position: absolute; left: 0; top: 0; width: 24px; height: 24px;
            background: var(--border); color: var(--text); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
        }
        .steps-list li.done { text-decoration: line-through; color: var(--text-muted); }
        .steps-list li.done::before { background: var(--brand); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kuliner 38 Provinsi Nusantara</h1>
        <p class="subtitle">Katalog lengkap 190 resep tradisional otentik dengan racikan rempah asli</p>
    </header>

    <div id="mainView">
        <div class="controls">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari resep, bahan, atau provinsi..." oninput="renderRecipes()">
                <select id="provinceSelect" class="select-input" onchange="renderRecipes()">
                    <option value="semua">Semua 38 Provinsi</option>
                    <!-- List Provinsi diisi via JS -->
                </select>
            </div>
            <div class="counter-badge" id="counterBadge">Memuat data resep...</div>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <div id="detailView" class="detail-view">
        <button class="btn-back" onclick="closeDetail()">← Kembali ke Katalog Menu</button>
        <div id="recipeDetail"></div>
    </div>
</div>

<script>
    let recipes = [];
    let currentServings = 4;
    let selectedRecipe = null;

    // Mengambil data resep dari file recipes.json
    async function loadRecipes() {
        try {
            const response = await fetch('recipes.json');
            recipes = await response.json();
            populateProvinceDropdown();
            renderRecipes();
        } catch (error) {
            console.error("Gagal memuat data resep:", error);
            document.getElementById('counterBadge').innerText = "Gagal memuat recipes.json. Pastikan file tersimpan di direktori yang sama.";
        }
    }

    function populateProvinceDropdown() {
        const select = document.getElementById('provinceSelect');
        const provinces = [...new Set(recipes.map(r => r.province))].sort();
        
        provinces.forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            select.appendChild(opt);
        });
    }

    function renderRecipes() {
        const grid = document.getElementById('recipeGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const selectedProv = document.getElementById('provinceSelect').value;
        grid.innerHTML = '';

        const filtered = recipes.filter(r => {
            const matchesSearch = r.name.toLowerCase().includes(search) || 
                                  r.province.toLowerCase().includes(search) ||
                                  r.region.toLowerCase().includes(search);
            const matchesProv = selectedProv === 'semua' || r.province === selectedProv;
            return matchesSearch && matchesProv;
        });

        document.getElementById('counterBadge').innerText = `Menampilkan ${filtered.length} dari ${recipes.length} Resep Otentik`;

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 48px 0;">Resep tidak ditemukan.</p>`;
            return;
        }

        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openDetail(r.id);
            card.innerHTML = `
                <img class="card-img" src="${r.image}" alt="${r.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400?text=Kuliner+Nusantara'">
                <div class="card-body">
                    <span class="card-region">${r.province}</span>
                    <h3 class="card-title">${r.name}</h3>
                    <div class="card-meta">
                        <span>⏱️ ${r.time}</span>
                        <span>📊 ${r.difficulty}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetail(id) {
        selectedRecipe = recipes.find(r => r.id === id);
        currentServings = selectedRecipe.basePortion;
        
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        
        renderDetailContent();
        window.scrollTo(0, 0);
    }

    function closeDetail() {
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
        selectedRecipe = null;
    }

    function updateServings(delta) {
        const newServings = currentServings + delta;
        if (newServings >= 1 && newServings <= 20) {
            currentServings = newServings;
            renderDetailContent();
        }
    }

    function renderDetailContent() {
        if (!selectedRecipe) return;

        const ratio = currentServings / selectedRecipe.basePortion;
        const container = document.getElementById('recipeDetail');

        const mapIngredient = (ing) => {
            const adjustedAmount = (ing.amount * ratio).toLocaleString('id-ID', { maximumFractionDigits: 1 });
            return `<li><strong>${adjustedAmount} ${ing.unit}</strong> ${ing.name}</li>`;
        };

        const mainIngHTML = selectedRecipe.mainIngredients.map(mapIngredient).join('');
        const bumbuHalusHTML = selectedRecipe.bumbuHalus.map(mapIngredient).join('');
        const bumbuRempahHTML = selectedRecipe.bumbuRempah.map(mapIngredient).join('');

        const stepsHTML = selectedRecipe.steps.map(step => {
            return `<li onclick="this.classList.toggle('done')">${step}</li>`;
        }).join('');

        container.innerHTML = `
            <span class="card-region">${selectedRecipe.province} (${selectedRecipe.region})</span>
            <h2 style="font-size: 1.6rem; font-weight: 800; margin-top: 4px;">${selectedRecipe.name}</h2>
            
            <img class="detail-img" src="${selectedRecipe.image}" alt="${selectedRecipe.name}" onerror="this.src='https://via.placeholder.com/600x400?text=Kuliner+Nusantara'">

            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Waktu Memasak: ${selectedRecipe.time} | Tingkat Kesulitan: ${selectedRecipe.difficulty}</p>

            <div class="portion-selector">
                <span style="font-size: 0.85rem; font-weight: 700;">Takaran Porsi:</span>
                <button class="portion-btn" onclick="updateServings(-1)">-</button>
                <span style="font-weight: 800; min-width: 20px; text-align: center;">${currentServings}</span>
                <button class="portion-btn" onclick="updateServings(1)">+</button>
            </div>

            <h3 class="section-title">1. Bahan Utama</h3>
            <ul class="ingredients-list">${mainIngHTML}</ul>

            <h3 class="section-title">2. Bumbu Halus (Ulek / Blender)</h3>
            <ul class="ingredients-list">${bumbuHalusHTML}</ul>

            <h3 class="section-title">3. Bumbu Rempah & Aromatik</h3>
            <ul class="ingredients-list">${bumbuRempahHTML}</ul>

            <h3 class="section-title">Langkah Memasak Otentik</h3>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom: 12px;">*Klik langkah untuk menandai instruksi yang sudah selesai.</p>
            <ol class="steps-list">${stepsHTML}</ol>
        `;
    }

    // Jalankan aplikasi
    loadRecipes();
</script>
</body>
</html>
