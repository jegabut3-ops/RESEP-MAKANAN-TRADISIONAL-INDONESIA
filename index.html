<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Catatan Tugas Canggih</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      height: fit-content;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 5px;
    }

    /* Form Input Area */
    .input-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-color);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .input-card input[type="text"],
    .input-card select,
    .input-card input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .btn-add {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    /* Progress Bar */
    .progress-section {
      margin-bottom: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      opacity: 0.8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.3s ease;
    }

    /* Controls (Filter & Search) */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
    }

    .filters {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .filter-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* Task List */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--card-bg);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .task-tags {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-category { background: #e0e7ff; color: #3730a3; }
    [data-theme="dark"] .badge-category { background: #312e81; color: #c7d2fe; }

    .priority-tinggi { background: #fee2e2; color: #991b1b; }
    .priority-sedang { background: #fef3c7; color: #92400e; }
    .priority-rendah { background: #d1fae5; color: #065f46; }

    .deadline-tag {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Daftar Tugas</h2>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <!-- Input Form -->
    <div class="input-card">
      <input type="text" id="taskInput" placeholder="Ketik tugas baru...">
      <div class="input-row">
        <select id="categorySelect">
          <option value="Umum">Umum</option>
          <option value="Pekerjaan">Pekerjaan</option>
          <option value="Rumah">Rumah</option>
          <option value="Belajar">Belajar</option>
        </select>
        <select id="prioritySelect">
          <option value="rendah">Rendah</option>
          <option value="sedang" selected>Sedang</option>
          <option value="tinggi">Tinggi</option>
        </select>
      </div>
      <input type="date" id="dateInput">
      <button class="btn-add" onclick="addTask()">+ Tambah Tugas</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="progress-text">
        <span>Progres Selesai</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="searchBox" class="search-box" placeholder="Cari tugas..." oninput="renderTasks()">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Aktif</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Selesai</button>
      </div>
    </div>

    <!-- Task List -->
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('advanced_tasks')) || [];
    let currentFilter = 'all';

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        themeToggle.textContent = '🌙';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '☀️';
      }
    });

    function saveTasks() {
      localStorage.setItem('advanced_tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const category = document.getElementById('categorySelect').value;
      const priority = document.getElementById('prioritySelect').value;
      const date = document.getElementById('dateInput').value;

      if (!input.value.trim()) return;

      const newTask = {
        id: Date.now(),
        text: input.value.trim(),
        category: category,
        priority: priority,
        date: date,
        completed: false
      };

      tasks.unshift(newTask);
      saveTasks();
      renderTasks();

      input.value = '';
      document.getElementById('dateInput').value = '';
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    function updateProgress() {
      if (tasks.length === 0) {
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressPercent').textContent = '0%';
        return;
      }
      const completed = tasks.filter(t => t.completed).length;
      const percent = Math.round((completed / tasks.length) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressPercent').textContent = percent + '%';
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const search = document.getElementById('searchBox').value.toLowerCase();
      list.innerHTML = '';

      let filtered = tasks.filter(t => {
        const matchesSearch = t.text.toLowerCase().includes(search);
        if (currentFilter === 'active') return matchesSearch && !t.completed;
        if (currentFilter === 'completed') return matchesSearch && t.completed;
        return matchesSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">Tidak ada tugas ditemukan</div>`;
      } else {
        filtered.forEach(task => {
          const item = document.createElement('li');
          item.className = `task-item ${task.completed ? 'completed' : ''}`;
          
          const priorityClass = `priority-${task.priority}`;

          item.innerHTML = `
            <div class="task-left">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
              <div class="task-details">
                <span class="task-title">${task.text}</span>
                <div class="task-tags">
                  <span class="badge badge-category">${task.category}</span>
                  <span class="badge ${priorityClass}">${task.priority.toUpperCase()}</span>
                  ${task.date ? `<span class="deadline-tag">📅 ${task.date}</span>` : ''}
                </div>
              </div>
            </div>
            <button class="btn-delete" onclick="deleteTask(${task.id})">🗑️</button>
          `;
          list.appendChild(item);
        });
      }

      updateProgress();
    }

    // Render Awal
    renderTasks();
  </script>
</body>
</html>
