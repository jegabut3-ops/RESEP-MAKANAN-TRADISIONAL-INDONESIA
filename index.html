<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Rumah & Bukti Foto</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            color: var(--text);
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Banner Mode Tugas Terkirim */
        .assigned-banner {
            background-color: #e0e7ff;
            border: 1px solid #c7d2fe;
            color: #3730a3;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .assigned-banner h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Form Card */
        .form-card {
            background-color: #f1f5f9;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        input[type="text"], input[type="date"], select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background-color: white;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row .form-group {
            flex: 1;
        }

        .btn-main {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        .btn-share {
            background-color: #0284c7;
        }

        .btn-share:hover {
            background-color: #0369a1;
        }

        .btn-complete {
            background-color: var(--success);
        }

        .btn-complete:hover {
            background-color: #059669;
        }

        /* Modal Share Link */
        .share-modal {
            display: none;
            background: #fff;
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            flex-direction: column;
            gap: 10px;
        }

        .share-input-group {
            display: flex;
            gap: 8px;
        }

        .share-input-group input {
            flex: 1;
            font-size: 12px;
        }

        /* Camera Section */
        .photo-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #cbd5e0;
        }

        .photo-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            flex: 1;
        }

        #cameraArea {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
        }

        video {
            width: 100%;
            max-height: 250px;
            border-radius: 6px;
            background: #222;
        }

        #previewImage {
            max-width: 100%;
            max-height: 180px;
            border-radius: 6px;
            display: none;
            object-fit: cover;
            margin-top: 5px;
        }

        /* Task Cards List */
        ul {
            list-style: none;
        }

        li {
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li.completed {
            background-color: #f8fafc;
            border-color: #cbd5e0;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }

        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge {
            background-color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-date {
            background-color: #fef3c7;
            color: #92400e;
        }

        .proof-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .status-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #b45309;
        }

        .status-done {
            background-color: #d1fae5;
            color: #047857;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏠 Penugasan Rumah & Bukti Foto</h1>
        <p class="subtitle">Kirim tugas ke orang lain via Link & Upload Bukti Foto saat selesai</p>

        <!-- Banner jika membuka tugas via Link dari orang lain -->
        <div id="assignedBanner" class="assigned-banner" style="display: none;">
            <h3>📥 Anda Menerima Penugasan!</h3>
            <p id="assignedDetails"></p>
        </div>

        <!-- Form Pembuat Tugas (Pemberi Tugas) -->
        <div id="creatorForm" class="form-card">
            <h3 style="font-size: 15px; margin-bottom: 5px;">1. Buat & Bagikan Tugas Baru</h3>
            
            <div class="form-group">
                <label>Nama Tugas Rumah:</label>
                <input type="text" id="taskTitle" placeholder="Misal: Menyapu & Mengepel Ruang Tamu...">
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label>Area / Kategori:</label>
                    <select id="taskCategory">
                        <option value="Dapur">🍳 Dapur</option>
                        <option value="Kamar Tidur">🛏️ Kamar Tidur</option>
                        <option value="Ruang Tamu">🛋️ Ruang Tamu</option>
                        <option value="Kamar Mandi">🚿 Kamar Mandi</option>
                        <option value="Halaman">🌱 Halaman</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tanggal Target (Deadline):</label>
                    <input type="date" id="taskDueDate">
                </div>
            </div>

            <button class="btn-main btn-share" onclick="generateShareLink()">🔗 Buat Link Tugas & Bagikan</button>

            <!-- Box Hasil Link -->
            <div id="shareModal" class="share-modal">
                <label>Salin & Kirim link ini ke WA/Pesan orang yang ditugaskan:</label>
                <div class="share-input-group">
                    <input type="text" id="shareUrlInput" readonly>
                    <button class="btn-main" onclick="copyLink()">Salin Link</button>
                </div>
            </div>
        </div>

        <!-- Form Pengerjaan Tugas (Penerima Tugas) -->
        <div id="assigneeForm" class="form-card" style="display: none;">
            <h3 style="font-size: 15px; margin-bottom: 5px;">2. Kerjakan Tugas & Upload Bukti Foto</h3>

            <div class="photo-input-group">
                <label>📷 Ambil / Upload Foto Bukti Selesai:</label>
                <div class="photo-buttons">
                    <button type="button" class="btn-secondary" onclick="startCamera()">📷 Buka Kamera</button>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Dari Galeri</button>
                </div>

                <!-- Live Camera -->
                <div id="cameraArea">
                    <video id="webcam" autoplay playsinline></video>
                    <button type="button" class="btn-main btn-complete" onclick="takeSnap()">📸 Jepret Foto Bukti</button>
                </div>

                <!-- Preview Gambar -->
                <img id="previewImage" alt="Preview Foto">
            </div>

            <button class="btn-main btn-complete" onclick="submitCompletedTask()">✅ Tandai Tugas Selesai</button>
        </div>

        <!-- Daftar Tugas -->
        <h3 style="font-size: 16px; margin: 20px 0 10px 0;">📋 Daftar Tugas</h3>
        <ul id="taskList"></ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('sharedHouseTasks')) || [];
        let currentPhotoBase64 = "";
        let stream = null;
        let incomingTaskData = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Set tanggal default ke hari ini
            document.getElementById('taskDueDate').valueAsDate = new Date();
            
            checkUrlParameters();
            renderTasks();
        });

        // 1. CEK URL APAKAH MEMBAWA TUGAS DARI ORANG LAIN
        function checkUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const taskDataParam = urlParams.get('taskData');

            if (taskDataParam) {
                try {
                    // Decode data dari URL parameter
                    const jsonString = decodeURIComponent(atob(taskDataParam));
                    incomingTaskData = JSON.parse(jsonString);

                    // Tampilkan Banner Informasi Tugas
                    document.getElementById('assignedBanner').style.display = 'block';
                    document.getElementById('assignedDetails').innerHTML = `
                        <strong>Tugas:</strong> ${incomingTaskData.title}<br>
                        <strong>Area:</strong> ${incomingTaskData.category} | <strong>Tanggal Target:</strong> ${incomingTaskData.dueDate}
                    `;

                    // Sembunyikan form pembuat, tampilkan form pengirim bukti
                    document.getElementById('creatorForm').style.display = 'none';
                    document.getElementById('assigneeForm').style.display = 'flex';

                } catch (e) {
                    console.error("Gagal membaca data tugas dari URL", e);
                }
            }
        }

        // 2. BAGIAN PEMBERI TUGAS: GENERATE LINK TUGAS
        function generateShareLink() {
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCategory').value;
            const dueDate = document.getElementById('taskDueDate').value;

            if (!title) {
                alert('Silakan isi nama tugas terlebih dahulu!');
                return;
            }

            const taskObj = {
                id: Date.now(),
                title: title,
                category: category,
                dueDate: dueDate,
                createdDate: new Date().toISOString().split('T')[0]
            };

            // Simpan juga ke list pembuat tugas sebagai status PENDING
            const localTask = { ...taskObj, status: 'Belum Selesai', photo: null };
            tasks.push(localTask);
            saveToStorage();

            // Encode data ke Base64 agar bisa dimasukkan ke dalam Link URL
            const encodedData = btoa(encodeURIComponent(JSON.stringify(taskObj)));
            const shareUrl = `${window.location.origin}${window.location.pathname}?taskData=${encodedData}`;

            // Tampilkan Link
            document.getElementById('shareUrlInput').value = shareUrl;
            document.getElementById('shareModal').style.display = 'flex';
            
            renderTasks();
        }

        function copyLink() {
            const input = document.getElementById('shareUrlInput');
            input.select();
            document.execCommand('copy');
            alert('Link tugas berhasil disalin! Silakan kirimkan ke WhatsApp atau aplikasi pesan teman/keluarga Anda.');
        }

        // 3. BAGIAN PENERIMA TUGAS: AKSES KAMERA & BUFFERS
        async function startCamera() {
            const cameraArea = document.getElementById('cameraArea');
            const video = document.getElementById('webcam');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                cameraArea.style.display = 'flex';
            } catch (err) {
                alert("Tidak dapat membuka kamera. Pastikan izin kamera sudah diaktifkan.");
            }
        }

        function takeSnap() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6); // Kompresi foto
            showPreview(currentPhotoBase64);

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraArea').style.display = 'none';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhotoBase64 = e.target.result;
                    showPreview(currentPhotoBase64);
                };
                reader.readAsDataURL(file);
            }
        }

        function showPreview(src) {
            const img = document.getElementById('previewImage');
            img.src = src;
            img.style.display = 'block';
        }

        // 4. SUBMIT PENGERJAAN TUGAS OLEH PENERIMA TUGAS
        function submitCompletedTask() {
            if (!currentPhotoBase64) {
                alert("Silakan ambil foto bukti terlebih dahulu sebelum menandai tugas selesai!");
                return;
            }

            const completedTask = {
                id: incomingTaskData.id || Date.now(),
                title: incomingTaskData.title,
                category: incomingTaskData.category,
                dueDate: incomingTaskData.dueDate,
                completedDate: new Date().toISOString().split('T')[0],
                photo: currentPhotoBase64,
                status: 'Selesai'
            };

            // Simpan atau perbarui di LocalStorage
            const existingIndex = tasks.findIndex(t => t.id === completedTask.id);
            if (existingIndex !== -1) {
                tasks[existingIndex] = completedTask;
            } else {
                tasks.push(completedTask);
            }

            saveToStorage();
            alert("Selamat! Tugas berhasil diselesaikan dan foto bukti telah disimpan.");

            // Reset URL dan kembali ke tampilan normal
            window.location.href = window.location.pathname;
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveToStorage();
            renderTasks();
        }

        function saveToStorage() {
            localStorage.setItem('sharedHouseTasks', JSON.stringify(tasks));
        }

        // 5. RENDER DAFTAR TUGAS
        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                listEl.innerHTML = '<li style="text-align:center; color:#94a3b8;">Belum ada tugas terdaftar.</li>';
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.status === 'Selesai') li.classList.add('completed');

                const isDone = task.status === 'Selesai';
                const statusBadge = isDone 
                    ? `<span class="status-tag status-done">✅ Selesai (${task.completedDate || 'Hari ini'})</span>`
                    : `<span class="status-tag status-pending">⏳ Menunggu Selesai</span>`;

                const photoHTML = task.photo 
                    ? `<img src="${task.photo}" class="proof-img" alt="Foto Bukti">`
                    : `<div style="font-size:12px; color:#94a3b8; font-style:italic;">Belum ada foto bukti diunggah.</div>`;

                li.innerHTML = `
                    <div class="task-header">
                        <div>
                            <div class="task-title">${task.title}</div>
                            <div class="task-meta">
                                <span class="badge">${task.category}</span>
                                <span class="badge badge-date">📅 Target: ${task.dueDate || 'Tanpa Tanggal'}</span>
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">Hapus</button>
                    </div>
                    <div>${statusBadge}</div>
                    ${photoHTML}
                `;

                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
