<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas Rumah Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 600px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
        }

        /* Progress Bar */
        .progress-container {
            background-color: #e2e8f0;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            font-weight: 600;
        }

        /* Form Input */
        .form-card {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="date"], select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background-color: white;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* Controls (Filter & Cari) */
        .controls-card {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 180px;
        }

        .filter-box {
            flex: 1;
            min-width: 130px;
        }

        /* List Items */
        ul {
            list-style: none;
        }

        li {
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border-left: 5px solid #cbd5e0;
        }

        li.p-Tinggi { border-left-color: #ef4444; }
        li.p-Sedang { border-left-color: #f59e0b; }
        li.p-Rendah { border-left-color: #10b981; }

        li.completed {
            background-color: #f8fafc;
            opacity: 0.6;
        }

        li.completed .title {
            text-decoration: line-through;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .title {
            font-weight: 600;
            color: var(--text);
            font-size: 15px;
        }

        .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background-color: #fca5a5;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏠 Management Tugas Rumah</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0% Selesai</div>
        </header>

        <!-- Form Tambah -->
        <div class="form-card">
            <input type="text" id="taskTitle" placeholder="Nama tugas (misal: Beli Tabung Gas)...">
            
            <div class="input-row">
                <select id="taskCategory">
                    <option value="Umum">📍 Area/Kategori</option>
                    <option value="Dapur">🍳 Dapur</option>
                    <option value="Kamar">🛏️ Kamar Tidur</option>
                    <option value="Ruang Tamu">🛋️ Ruang Tamu</option>
                    <option value="Kamar Mandi">🚿 Kamar Mandi</option>
                    <option value="Belanja">🛒 Belanja</option>
                </select>

                <select id="taskPriority">
                    <option value="Sedang">⚡ Prioritas</option>
                    <option value="Tinggi">🔴 Tinggi</option>
                    <option value="Sedang">🟠 Sedang</option>
                    <option value="Rendah">🟢 Rendah</option>
                </select>
            </div>

            <div class="input-row">
                <input type="date" id="taskDueDate">
                <button class="btn-add" onclick="addTask()">+ Tambah Tugas</button>
            </div>
        </div>

        <!-- Filter & Search -->
        <div class="controls-card">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari tugas..." oninput="renderTasks()">
            <select id="filterStatus" class="filter-box" onchange="renderTasks()">
                <option value="all">Semua Status</option>
                <option value="active">Belum Selesai</option>
                <option value="completed">Selesai</option>
            </select>
        </div>

        <!-- List Tugas -->
        <ul id="taskList"></ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('proTasks')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderTasks();
            updateProgress();
        });

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;

            if (!title) {
                alert('Nama tugas tidak boleh kosong!');
                return;
            }

            const newTask = {
                id: Date.now(),
                title: title,
                category: category,
                priority: priority,
                dueDate: dueDate,
                completed: false
            };

            tasks.push(newTask);
            saveData();
            
            // Reset Form
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDueDate').value = '';
            document.getElementById('taskCategory').value = 'Umum';
            document.getElementById('taskPriority').value = 'Sedang';

            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) task.completed = !task.completed;
                return task;
            });
            saveData();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveData();
            renderTasks();
        }

        function saveData() {
            localStorage.setItem('proTasks', JSON.stringify(tasks));
            updateProgress();
        }

        function updateProgress() {
            if (tasks.length === 0) {
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0% Selesai';
                return;
            }

            const completedTasks = tasks.filter(t => t.completed).length;
            const percentage = Math.round((completedTasks / tasks.length) * 100);

            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').innerText = `${percentage}% Selesai (${completedTasks}/${tasks.length})`;
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            listEl.innerHTML = '';

            const filteredTasks = tasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(searchQuery);
                const matchesStatus = 
                    filterStatus === 'all' ? true :
                    filterStatus === 'completed' ? task.completed : !task.completed;

                return matchesSearch && matchesStatus;
            });

            if (filteredTasks.length === 0) {
                listEl.innerHTML = `<div class="empty-state">Tidak ada tugas ditemukan.</div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `p-${task.priority} ${task.completed ? 'completed' : ''}`;

                const dateFormatted = task.dueDate ? new Date(task.dueDate).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : 'Tanpa Tenggat';

                li.innerHTML = `
                    <div class="info" onclick="toggleTask(${task.id})">
                        <span class="title">${task.title}</span>
                        <div class="meta">
                            <span class="badge">${task.category}</span>
                            <span>📅 ${dateFormatted}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteTask(${task.id})">Hapus</button>
                    </div>
                `;

                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
