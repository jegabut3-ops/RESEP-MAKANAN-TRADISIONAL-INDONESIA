<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas Ultra Pro</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4fd 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 24px 12px;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Form Card */
        .input-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px dashed var(--card-border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .preview-container {
            display: none;
            position: relative;
            margin-top: 5px;
            border-radius: 10px;
            overflow: hidden;
            max-height: 180px;
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-remove-preview {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(239, 68, 68, 0.9);
            color: white; border: none;
            width: 28px; height: 28px;
            border-radius: 50%; cursor: pointer;
        }

        .btn-submit {
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: white; border: none;
            padding: 12px; border-radius: 10px;
            font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover { opacity: 0.95; }

        /* Progress Bar */
        .progress-box {
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; font-weight: 600; margin-bottom: 6px;
        }

        .progress-bar {
            height: 8px; background: rgba(0,0,0,0.08);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4);
            width: 0%; transition: width 0.4s ease;
        }

        /* Filter & Search */
        .search-box {
            position: relative; margin-bottom: 12px;
        }

        .search-box i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: var(--text-secondary);
        }

        .search-box input {
            padding-left: 40px;
        }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1; padding: 8px; border-radius: 8px;
            border: 1px solid var(--card-border);
            background: transparent; color: var(--text-secondary);
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary); color: white;
            border-color: var(--primary);
        }

        /* Task List */
        .task-list {
            display: flex; flex-direction: column; gap: 12px;
            max-height: 400px; overflow-y: auto; padding-right: 4px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-title-text {
            text-decoration: line-through;
        }

        .task-top {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
        }

        .task-check-wrapper {
            display: flex; align-items: flex-start; gap: 10px; flex: 1;
        }

        .custom-checkbox {
            width: 20px; height: 20px; border-radius: 6px;
            border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; margin-top: 2px;
        }

        .task-item.completed .custom-checkbox {
            background: var(--primary); color: white;
        }

        .task-title-text {
            font-weight: 600; font-size: 0.95rem; word-break: break-word;
        }

        .btn-delete {
            background: transparent; border: none;
            color: var(--danger); cursor: pointer; font-size: 1rem;
            padding: 4px;
        }

        .task-meta {
            display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.75rem;
        }

        .badge {
            padding: 3px 8px; border-radius: 6px; font-weight: 600;
        }

        .badge-cat { background: rgba(79, 70, 229, 0.15); color: var(--primary); }
        .badge-prio-Tinggi { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-prio-Sedang { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-prio-Rendah { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-date { background: rgba(100, 116, 139, 0.15); color: var(--text-secondary); }
        .badge-overdue { background: rgba(239, 68, 68, 0.2); color: var(--danger); font-weight: 700; }

        .task-photo-thumb {
            width: 100%; max-height: 140px; object-fit: cover;
            border-radius: 8px; cursor: pointer; margin-top: 4px;
            border: 1px solid var(--card-border);
        }

        /* Footer Tools */
        .footer-tools {
            display: flex; gap: 8px; margin-top: 16px;
            padding-top: 16px; border-top: 1px solid var(--card-border);
        }

        .tool-btn {
            flex: 1; padding: 8px; border-radius: 8px;
            border: 1px solid var(--card-border);
            background: transparent; color: var(--text-secondary);
            font-size: 0.75rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        /* Lightbox Modal */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            z-index: 999; justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal img {
            max-width: 90%; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="app-header">
        <div class="app-title">
            <i class="fa-solid fa-square-check"></i> TaskFlow Pro
        </div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Form Input -->
    <div class="input-card">
        <input type="text" id="taskTitle" class="input-field" placeholder="Ketik nama tugas baru...">
        
        <div class="row-inputs">
            <select id="taskCategory" class="input-field">
                <option value="Rumah">🏠 Rumah</option>
                <option value="Kerja">💼 Kerja</option>
                <option value="Belajar">🎓 Belajar</option>
                <option value="Lainnya">📌 Lainnya</option>
            </select>
            
            <select id="taskPriority" class="input-field">
                <option value="Rendah">🟢 Rendah</option>
                <option value="Sedang" selected>🟡 Sedang</option>
                <option value="Tinggi">🔴 Tinggi</option>
            </select>
        </div>

        <input type="date" id="taskDate" class="input-field">

        <!-- Input File / Kamera -->
        <label class="file-input-wrapper">
            <i class="fa-solid fa-camera"></i>
            <span id="fileLabel">Unggah atau Ambil Foto Bukti</span>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
        </label>

        <!-- Preview Foto Sementara -->
        <div id="previewContainer" class="preview-container">
            <img id="previewImg" src="" alt="Preview">
            <button class="btn-remove-preview" onclick="clearPhotoSelection()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <button class="btn-submit" onclick="addTask()">
            <i class="fa-solid fa-plus"></i> Tambahkan Tugas
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-box">
        <div class="progress-header">
            <span>Progres Selesai</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="input-field" placeholder="Cari tugas..." oninput="renderTasks()">
    </div>

    <div class="filter-tabs">
        <button id="filterAll" class="tab-btn active" onclick="setFilter('all')">Semua</button>
        <button id="filterActive" class="tab-btn" onclick="setFilter('active')">Aktif</button>
        <button id="filterCompleted" class="tab-btn" onclick="setFilter('completed')">Selesai</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList"></div>

    <!-- Tools / Backup -->
    <div class="footer-tools">
        <button class="tool-btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Backup</button>
        <button class="tool-btn" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> Restore</button>
        <button class="tool-btn" style="color: var(--danger);" onclick="clearAll()"><i class="fa-solid fa-trash"></i> Reset</button>
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
    </div>
</div>

<!-- Modal Zoom Foto -->
<div class="modal" id="photoModal" onclick="closeModal()">
    <img id="modalImg" src="">
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('ultra_tasks_data')) || [];
    let currentPhotoBase64 = "";
    let currentFilter = 'all';

    // Set Default Tanggal ke Hari Ini
    document.getElementById('taskDate').valueAsDate = new Date();

    // Compression Foto via Canvas (Solusi Memori & Mencegah Bug)
    function handlePhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const maxWidth = 700;
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.75);
                
                document.getElementById('previewImg').src = currentPhotoBase64;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('fileLabel').innerText = file.name;
            }
        }
        reader.readAsDataURL(file);
    }

    function clearPhotoSelection() {
        currentPhotoBase64 = "";
        document.getElementById('photoInput').value = "";
        document.getElementById('previewContainer').style.display = 'none';
        document.getElementById('fileLabel').innerText = "Unggah atau Ambil Foto Bukti";
    }

    // Tambah Tugas Baru
    function addTask() {
        const title = document.getElementById('taskTitle').value.trim();
        const category = document.getElementById('taskCategory').value;
        const priority = document.getElementById('taskPriority').value;
        const date = document.getElementById('taskDate').value;

        if (!title) {
            alert('Judul tugas tidak boleh kosong!');
            return;
        }

        const newTask = {
            id: Date.now(),
            title: title,
            category: category,
            priority: priority,
            date: date,
            photo: currentPhotoBase64, // Memori foto tersimpan independen di task
            completed: false
        };

        tasks.unshift(newTask);
        saveAndRender();

        // RESET INPUT PENGUNGGAHAN FOTO
        document.getElementById('taskTitle').value = '';
        clearPhotoSelection();
    }

    // Status Selesai
    function toggleTask(id) {
        tasks = tasks.map(task => task.id === id ? {...task, completed: !task.completed} : task);
        saveAndRender();
    }

    // Hapus Tugas
    function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        saveAndRender();
    }

    // Filter Handling
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`).classList.add('active');
        renderTasks();
    }

    // Render Tugas
    function renderTasks() {
        const listContainer = document.getElementById('taskList');
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        listContainer.innerHTML = '';

        const todayStr = new Date().toISOString().split('T')[0];

        let filteredTasks = tasks.filter(task => {
            const matchesSearch = task.title.toLowerCase().includes(searchQuery);
            if (currentFilter === 'active') return matchesSearch && !task.completed;
            if (currentFilter === 'completed') return matchesSearch && task.completed;
            return matchesSearch;
        });

        if (filteredTasks.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-secondary); font-size:0.85rem;">Tidak ada tugas ditemukan.</div>`;
        }

        filteredTasks.forEach(task => {
            const isOverdue = !task.completed && task.date < todayStr;
            const isToday = task.date === todayStr;

            const card = document.createElement('div');
            card.className = `task-item ${task.completed ? 'completed' : ''}`;

            const photoHTML = task.photo ? 
                `<img src="${task.photo}" class="task-photo-thumb" onclick="openModal('${task.photo}')" title="Klik untuk memperbesar">` : '';

            let dateBadgeClass = 'badge-date';
            let dateText = task.date;
            if (isToday) { dateText = "Hari ini"; dateBadgeClass = 'badge-prio-Sedang'; }
            else if (isOverdue) { dateText = `Terlewat (${task.date})`; dateBadgeClass = 'badge-overdue'; }

            card.innerHTML = `
                <div class="task-top">
                    <div class="task-check-wrapper">
                        <div class="custom-checkbox" onclick="toggleTask(${task.id})">
                            ${task.completed ? '<i class="fa-solid fa-check" style="font-size:12px;"></i>' : ''}
                        </div>
                        <span class="task-title-text">${escapeHtml(task.title)}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <div class="task-meta">
                    <span class="badge badge-cat">${task.category}</span>
                    <span class="badge badge-prio-${task.priority}">${task.priority}</span>
                    <span class="badge ${dateBadgeClass}"><i class="fa-regular fa-calendar"></i> ${dateText}</span>
                </div>
                ${photoHTML}
            `;
            listContainer.appendChild(card);
        });

        updateProgress();
    }

    function updateProgress() {
        if (tasks.length === 0) {
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';
            return;
        }
        const completedCount = tasks.filter(t => t.completed).length;
        const percentage = Math.round((completedCount / tasks.length) * 100);
        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('progressText').innerText = percentage + '%';
    }

    function saveAndRender() {
        localStorage.setItem('ultra_tasks_data', JSON.stringify(tasks));
        renderTasks();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Modal Image
    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('photoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('photoModal').style.display = 'none';
    }

    // Theme Toggle
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    // Backup & Restore
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `backup_tugas_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    tasks = imported;
                    saveAndRender();
                    alert("Data berhasil dipulihkan!");
                }
            } catch (err) {
                alert("File JSON tidak valid!");
            }
        };
        reader.readAsText(file);
    }

    function clearAll() {
        if (confirm("Apakah kamu yakin ingin menghapus semua tugas?")) {
            tasks = [];
            saveAndRender();
        }
    }

    renderTasks();
</script>
</body>
</html>
