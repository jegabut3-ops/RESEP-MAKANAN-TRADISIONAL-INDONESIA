<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Master Workspace</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #05070f;
            --card-bg: rgba(15, 22, 36, 0.88);
            --border: rgba(0, 240, 255, 0.25);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --pink: #ff007f;
            --cyan: #00f0ff;
            --purple: #8b5cf6;
            --green: #10b981;
            --yellow: #f59e0b;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        #bgCanvas, #confettiCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        #confettiCanvas { z-index: 9999; }

        .app-container { width: 100%; max-width: 680px; position: relative; z-index: 1; }

        /* Header UI */
        .header-card {
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px 20px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .logo { font-size: 1.5rem; font-weight: 900; background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .xp-badge {
            background: rgba(139, 92, 246, 0.2); border: 1px solid var(--purple);
            padding: 6px 14px; border-radius: 30px; font-weight: 800; font-size: 0.85rem;
            color: var(--cyan); display: flex; align-items: center; gap: 8px;
        }

        /* Pomodoro Timer */
        .pomo-card {
            background: rgba(255, 0, 127, 0.08); border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: var(--radius); padding: 14px 20px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .pomo-timer { font-size: 1.5rem; font-weight: 900; color: var(--pink); font-family: monospace; }

        .btn-pomo {
            background: var(--pink); border: none; color: white; padding: 6px 14px;
            border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.8rem;
        }

        /* Input Card Form */
        .form-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .input-group { position: relative; width: 100%; }

        .input-control {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: rgba(0, 0, 0, 0.5);
            color: #fff; font-size: 0.9rem; outline: none;
        }

        .input-control:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

        .btn-voice {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: var(--purple); border: none; color: white;
            width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
        }

        .btn-voice.recording { background: var(--pink); animation: pulse 1s infinite; }

        /* Express Deadline Presets */
        .express-container {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border: 1px dashed var(--border);
        }

        .express-label { font-size: 0.75rem; font-weight: 700; color: var(--yellow); margin-bottom: 6px; }

        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .btn-preset {
            padding: 8px; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: white; font-size: 0.75rem; font-weight: 700;
            cursor: pointer; text-align: center;
        }

        .btn-preset.active, .btn-preset:hover { background: var(--cyan); color: #000; font-weight: 800; }
        .btn-preset.half-hour { border-color: var(--pink); color: var(--pink); }
        .btn-preset.half-hour.active, .btn-preset.half-hour:hover { background: var(--pink); color: white; }

        .btn-submit {
            background: linear-gradient(90deg, var(--pink), var(--purple));
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 0.95rem; text-transform: uppercase; cursor: pointer;
            letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-submit:hover { filter: brightness(1.2); transform: scale(1.01); }

        /* Controls Filter Bar */
        .controls-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        
        .tab-btn {
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-sub); font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }

        .tab-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

        /* Task Cards */
        .task-list { display: flex; flex-direction: column; gap: 12px; }

        .task-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px;
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
        }

        .task-card[data-priority="Tinggi"] { border-left: 5px solid var(--pink); }
        .task-card[data-priority="Sedang"] { border-left: 5px solid var(--yellow); }
        .task-card[data-priority="Rendah"] { border-left: 5px solid var(--green); }

        .task-card.completed { opacity: 0.4; filter: grayscale(0.5); }
        .task-card.completed .task-title { text-decoration: line-through; }

        .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-title { font-weight: 800; font-size: 1rem; }

        .timer-badge {
            font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px;
            background: rgba(255, 255, 255, 0.1); display: inline-flex; align-items: center; gap: 4px;
        }

        .timer-badge.kritis { background: rgba(255, 0, 127, 0.2); color: var(--pink); border: 1px solid var(--pink); animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .task-actions { display: flex; gap: 8px; align-items: center; }

        .btn-icon { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1rem; }
        .btn-icon:hover { color: var(--cyan); }

        .subtask-box {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-top: 4px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .subtask-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }

        .task-img-thumb {
            width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px;
            cursor: pointer; border: 1px solid var(--border); margin-top: 6px;
        }

        /* Lightbox Modal */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 99999; justify-content: center; align-items: center; padding: 20px;
        }
        .modal img { max-width: 90%; max-height: 80vh; border-radius: 16px; border: 2px solid var(--cyan); }
    </style>
</head>
<body>

<!-- Dynamic Canvas Backgrounds -->
<canvas id="bgCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>

<div class="app-container">
    <!-- Header -->
    <div class="header-card">
        <div class="logo"><i class="fa-solid fa-atom"></i> TaskFlow Master</div>
        <div class="xp-badge">
            <i class="fa-solid fa-trophy" style="color:var(--yellow);"></i>
            <span>XP: <b id="xpVal">0</b> | Lvl <b id="lvlVal">1</b></span>
        </div>
    </div>

    <!-- Pomodoro Timer -->
    <div class="pomo-card">
        <div>
            <div style="font-size:0.75rem; font-weight:800; color:var(--text-sub);">🎯 POMODORO FOCUS TIMER</div>
            <div class="pomo-timer" id="pomoDisplay">25:00</div>
        </div>
        <button class="btn-pomo" id="pomoBtn" onclick="togglePomodoro()">Mulai Fokus</button>
    </div>

    <!-- Form Input Tugas -->
    <div class="form-card">
        <div class="input-group">
            <input type="text" id="taskTitle" class="input-control" placeholder="Ketik tugas atau gunakan mic...">
            <button class="btn-voice" id="micBtn" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <select id="taskCategory" class="input-control">
                <option value="Rumah">🏠 Rumah</option>
                <option value="Kerja">💼 Kerja</option>
                <option value="Belajar">🎓 Belajar</option>
                <option value="Kesehatan">💊 Kesehatan</option>
            </select>
            <select id="taskPriority" class="input-control">
                <option value="Rendah">🟢 Rendah</option>
                <option value="Sedang" selected>🟡 Sedang</option>
                <option value="Tinggi">🔴 Tinggi</option>
            </select>
        </div>

        <!-- Tenggat Express -->
        <div class="express-container">
            <div class="express-label"><i class="fa-solid fa-stopwatch"></i> Tenggat Waktu Express:</div>
            <div class="preset-grid">
                <button type="button" class="btn-preset half-hour active" onclick="setQuickDeadline(30, this)">⏱️ ½ Jam</button>
                <button type="button" class="btn-preset" onclick="setQuickDeadline(60, this)">⚡ 1 Jam</button>
                <button type="button" class="btn-preset" onclick="setQuickDeadline(180, this)">🚀 3 Jam</button>
                <button type="button" class="btn-preset" onclick="setQuickDeadline('tonight', this)">🌙 Malam Ini</button>
            </div>
        </div>

        <input type="datetime-local" id="taskDate" class="input-control">

        <!-- Upload Foto Bukti -->
        <label style="border:1px dashed var(--cyan); padding:8px; border-radius:10px; text-align:center; cursor:pointer; color:var(--cyan); font-weight:700; font-size:0.8rem;">
            📷 <span id="photoLabel">Unggah Foto Bukti</span>
            <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
        </label>

        <div id="previewContainer" style="display:none; position:relative;">
            <img id="previewImg" src="" style="width:100%; max-height:120px; object-fit:cover; border-radius:10px;">
            <button onclick="clearPhoto()" style="position:absolute; top:6px; right:6px; background:var(--pink); color:white; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer;">×</button>
        </div>

        <button class="btn-submit" onclick="addTask()"><i class="fa-solid fa-plus-circle"></i> Tambah Tugas</button>
    </div>

    <!-- Controls Filter & Search -->
    <div class="controls-bar">
        <div style="display:flex; gap:4px;">
            <button class="tab-btn active" id="f-all" onclick="setFilter('all')">Semua</button>
            <button class="tab-btn" id="f-active" onclick="setFilter('active')">Aktif</button>
            <button class="tab-btn" id="f-completed" onclick="setFilter('completed')">Selesai</button>
        </div>
        <input type="text" id="searchInput" class="input-control" style="width: 150px; padding: 4px 8px; font-size:0.8rem;" placeholder="Cari..." oninput="renderTasks()">
    </div>

    <!-- Container Daftar Tugas -->
    <div class="task-list" id="taskList"></div>
</div>

<!-- Modal Photo Lightbox -->
<div class="modal" id="photoModal" onclick="closeModal()">
    <img id="modalImg" src="">
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('nexus_master_tasks')) || [];
    let xp = parseInt(localStorage.getItem('nexus_master_xp')) || 0;
    let currentPhotoBase64 = "";
    let currentFilter = 'all';

    // Set Default Ke 30 Menit (½ Jam)
    setQuickDeadline(30);

    function setQuickDeadline(mins, btnEl) {
        if (btnEl) {
            document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }
        const target = new Date();
        if (mins === 'tonight') {
            target.setHours(23, 59, 0, 0);
        } else {
            target.setMinutes(target.getMinutes() + parseInt(mins));
        }
        target.setMinutes(target.getMinutes() - target.getTimezoneOffset());
        document.getElementById('taskDate').value = target.toISOString().slice(0, 16);
    }

    // Voice Speech Synthesis (Asisten Membacakan Tugas)
    function speakTask(text, diffMins) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msgText = `Tugas: ${text}. `;
            if (diffMins < 0) msgText += "Waktu tenggat sudah terlewat!";
            else msgText += `Sisa waktu ${diffMins} menit lagi.`;

            const utterance = new SpeechSynthesisUtterance(msgText);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }
    }

    // Perintah Suara (Speech Recognition)
    function toggleVoiceInput() {
        const micBtn = document.getElementById('micBtn');
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            return alert("Browser tidak mendukung pengenalan suara.");
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';

        recognition.onstart = function() { micBtn.classList.add('recording'); };
        recognition.onend = function() { micBtn.classList.remove('recording'); };
        recognition.onresult = function(event) {
            document.getElementById('taskTitle').value = event.results[0][0].transcript;
        };
        recognition.start();
    }

    // Pomodoro Timer Logic
    let pomoTime = 25 * 60;
    let pomoInterval = null;
    function togglePomodoro() {
        const btn = document.getElementById('pomoBtn');
        if (pomoInterval) {
            clearInterval(pomoInterval);
            pomoInterval = null;
            btn.innerText = 'Lanjutkan';
        } else {
            btn.innerText = 'Jeda';
            pomoInterval = setInterval(() => {
                pomoTime--;
                const m = Math.floor(pomoTime / 60).toString().padStart(2, '0');
                const s = (pomoTime % 60).toString().padStart(2, '0');
                document.getElementById('pomoDisplay').innerText = `${m}:${s}`;
                if (pomoTime <= 0) {
                    clearInterval(pomoInterval);
                    alert("Waktu Pomodoro Selesai! Istirahat 5 menit.");
                    pomoTime = 25 * 60;
                    document.getElementById('pomoDisplay').innerText = "25:00";
                    btn.innerText = 'Mulai Fokus';
                }
            }, 1000);
        }
    }

    // Compress Foto
    function handlePhotoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxW = 600;
                let w = img.width, h = img.height;
                if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);

                currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('previewImg').src = currentPhotoBase64;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('photoLabel').innerText = file.name;
            }
        }
        reader.readAsDataURL(file);
    }

    function clearPhoto() {
        currentPhotoBase64 = "";
        document.getElementById('photoInput').value = "";
        document.getElementById('previewContainer').style.display = 'none';
        document.getElementById('photoLabel').innerText = "Unggah Foto Bukti";
    }

    // CRUD & Subtasks Logic
    function addTask() {
        const title = document.getElementById('taskTitle').value.trim();
        const category = document.getElementById('taskCategory').value;
        const priority = document.getElementById('taskPriority').value;
        const date = document.getElementById('taskDate').value;

        if (!title) return alert("Judul tugas wajib diisi!");

        const newTask = {
            id: Date.now(),
            title: title,
            category: category,
            priority: priority,
            date: date,
            photo: currentPhotoBase64,
            completed: false,
            subtasks: []
        };

        tasks.unshift(newTask);
        saveAndRender();

        document.getElementById('taskTitle').value = '';
        clearPhoto();
        setQuickDeadline(30);
    }

    function toggleTask(id) {
        tasks = tasks.map(t => {
            if (t.id === id) {
                const isDone = !t.completed;
                if (isDone) {
                    addXP(50);
                    triggerConfetti();
                }
                return {...t, completed: isDone};
            }
            return t;
        });
        saveAndRender();
    }

    function addSubtask(id) {
        const text = prompt("Masukkan rincian sub-tugas:");
        if (!text) return;
        tasks = tasks.map(t => {
            if (t.id === id) {
                t.subtasks.push({ id: Date.now(), text: text, done: false });
            }
            return t;
        });
        saveAndRender();
    }

    function toggleSubtask(taskId, subId) {
        tasks = tasks.map(t => {
            if (t.id === taskId) {
                t.subtasks = t.subtasks.map(s => s.id === subId ? {...s, done: !s.done} : s);
            }
            return t;
        });
        saveAndRender();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function addXP(points) {
        xp += points;
        localStorage.setItem('nexus_master_xp', xp);
        updateXPUI();
    }

    function updateXPUI() {
        document.getElementById('xpVal').innerText = xp;
        document.getElementById('lvlVal').innerText = Math.floor(xp / 200) + 1;
    }

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`f-${f}`).classList.add('active');
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        let filtered = tasks.filter(t => {
            const matches = t.title.toLowerCase().includes(query);
            if (currentFilter === 'active') return matches && !t.completed;
            if (currentFilter === 'completed') return matches && t.completed;
            return matches;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-sub);">Tidak ada tugas saat ini.</div>`;
            return;
        }

        filtered.forEach(t => {
            const card = document.createElement('div');
            card.className = `task-card ${t.completed ? 'completed' : ''}`;
            card.setAttribute('data-priority', t.priority);

            const diffMins = Math.round((new Date(t.date) - new Date()) / 60000);
            let timerHTML = '';

            if (t.completed) {
                timerHTML = `<span class="timer-badge">✓ Selesai</span>`;
            } else if (diffMins < 0) {
                timerHTML = `<span class="timer-badge kritis">Terlewat (${Math.abs(diffMins)} Mnt)</span>`;
            } else if (diffMins <= 30) {
                timerHTML = `<span class="timer-badge kritis"><i class="fa-solid fa-clock"></i> Sisa ${diffMins} Mnt!</span>`;
            } else {
                timerHTML = `<span class="timer-badge"><i class="fa-regular fa-clock"></i> ${Math.floor(diffMins/60)}j ${diffMins%60}m</span>`;
            }

            const photoHTML = t.photo ? `<img src="${t.photo}" class="task-img-thumb" onclick="openModal('${t.photo}')">` : '';

            let subtasksHTML = '';
            if (t.subtasks && t.subtasks.length > 0) {
                subtasksHTML = `<div class="subtask-box">` + t.subtasks.map(s => `
                    <div class="subtask-item">
                        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${t.id}, ${s.id})">
                        <span style="${s.done ? 'text-decoration:line-through; opacity:0.5;' : ''}">${s.text}</span>
                    </div>
                `).join('') + `</div>`;
            }

            card.innerHTML = `
                <div class="task-header">
                    <div style="display:flex; gap:10px; align-items:flex-start;">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" style="width:20px; height:20px; margin-top:2px;">
                        <div>
                            <div class="task-title">${t.title}</div>
                            <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">
                                ${timerHTML}
                                <span class="timer-badge">${t.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon" onclick="speakTask('${t.title}', ${diffMins})" title="Dengarkan Suara"><i class="fa-solid fa-volume-high"></i></button>
                        <button class="btn-icon" onclick="addSubtask(${t.id})" title="Tambah Sub-tugas"><i class="fa-solid fa-list-check"></i></button>
                        <button class="btn-icon" onclick="deleteTask(${t.id})" style="color:var(--pink);"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                ${subtasksHTML}
                ${photoHTML}
            `;
            list.appendChild(card);
        });

        updateXPUI();
    }

    function saveAndRender() {
        localStorage.setItem('nexus_master_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('photoModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('photoModal').style.display = 'none'; }

    // Efek Confetti Explosion
    function triggerConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let pieces = [];
        for (let i = 0; i < 80; i++) {
            pieces.push({
                x: canvas.width / 2, y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12 - 4,
                color: ['#ff007f', '#00f0ff', '#8b5cf6', '#10b981', '#ffe600'][Math.floor(Math.random() * 5)],
                size: Math.random() * 8 + 4, opacity: 1
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            pieces.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.opacity -= 0.015;
                if (p.opacity > 0) {
                    active = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.opacity;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            if (active) requestAnimationFrame(draw);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        draw();
    }

    // Dynamic Background Particles Canvas
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let pts = [];
    function initBg() {
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        pts = [];
        for(let i=0; i<30; i++) {
            pts.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
        }
    }
    function drawBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        pts.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
            bgCtx.beginPath(); bgCtx.arc(p.x, p.y, 2, 0, Math.PI*2); bgCtx.fill();
        });
        requestAnimationFrame(drawBg);
    }
    window.onresize = initBg;
    initBg(); drawBg();

    setInterval(renderTasks, 30000);
    renderTasks();
</script>
</body>
</html>
