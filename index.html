<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Masakan Nusantara Otentik & Komplit</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --brand: #c2410c;
            --brand-light: #fff7ed;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f17;
                --surface: #151c2c;
                --border: #1e293b;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --brand: #ea580c;
                --brand-light: #1c1917;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }

        header { margin-bottom: 24px; }
        h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        
        .search-row { display: flex; gap: 10px; }
        
        .search-input, .select-input {
            padding: 12px 16px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 0.95rem; outline: none;
        }
        .search-input { flex: 1; }
        .search-input:focus, .select-input:focus { border-color: var(--brand); }

        .counter-badge {
            font-size: 0.85rem; font-weight: 700; color: var(--brand);
            background: var(--brand-light); padding: 8px 12px; border-radius: 8px; width: fit-content;
        }

        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--brand); }

        .card-img {
            width: 100%; height: 170px; object-fit: cover; background-color: var(--border);
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-region { font-size: 0.75rem; font-weight: 700; color: var(--brand); text-transform: uppercase; }
        .card-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0 8px 0; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; margin-top: auto; }

        .detail-view { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .detail-img {
            width: 100%; max-height: 340px; object-fit: cover; border-radius: var(--radius); margin: 12px 0;
        }

        .btn-back {
            background: none; border: none; color: var(--brand); font-weight: 700;
            font-size: 0.9rem; cursor: pointer; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px;
        }

        .portion-selector {
            display: flex; align-items: center; gap: 12px; background: var(--brand-light);
            padding: 10px 16px; border-radius: var(--radius); margin: 16px 0 24px 0; width: fit-content;
        }
        .portion-btn {
            background: var(--surface); border: 1px solid var(--border); width: 28px; height: 28px;
            border-radius: 6px; font-weight: 700; cursor: pointer; color: var(--text);
        }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-top: 20px; margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
        
        .ingredients-list { list-style: none; margin-bottom: 16px; }
        .ingredients-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }

        .steps-list { list-style: none; counter-reset: step-counter; }
        .steps-list li {
            position: relative; padding-left: 36px; margin-bottom: 16px;
            font-size: 0.95rem; line-height: 1.5; cursor: pointer;
        }
        .steps-list li::before {
            counter-increment: step-counter; content: counter(step-counter);
            position: absolute; left: 0; top: 0; width: 24px; height: 24px;
            background: var(--border); color: var(--text); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
        }
        .steps-list li.done { text-decoration: line-through; color: var(--text-muted); }
        .steps-list li.done::before { background: var(--brand); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Resep Kuliner Nusantara</h1>
        <p class="subtitle">Katalog resep otentik lengkap dengan racikan rempah super komplit & foto valid</p>
    </header>

    <div id="mainView">
        <div class="controls">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari resep atau daerah..." oninput="renderRecipes()">
                <select id="regionSelect" class="select-input" onchange="renderRecipes()">
                    <option value="semua">Semua Wilayah</option>
                    <option value="Sumatera">Sumatera</option>
                    <option value="Jawa">Jawa & Bali</option>
                    <option value="Kalimantan">Kalimantan</option>
                    <option value="Sulawesi">Sulawesi</option>
                    <option value="Papua">Papua & Maluku</option>
                </select>
            </div>
            <div class="counter-badge" id="counterBadge">Loading...</div>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <div id="detailView" class="detail-view">
        <button class="btn-back" onclick="closeDetail()">← Kembali ke Daftar Menu</button>
        <div id="recipeDetail"></div>
    </div>
</div>

<script>
    // Data Resep Otentik dengan Rincian Bumbu Halus dan Bumbu Kering/Rempah Lengkap
    const recipes = [
        {

                { name: "Jintan sangrai (haluskan)", amount: 0.5, unit: "sdt" },

                { name: "Kapulaga jawa", amount: 3, unit: "butir" },
                { name: "Bunga lawang (pekak)", amount: 2, unit: "bintang" },
                { name: "Kayu manis", amount: 3, unit: "cm" },
                { name: "Daun kunyit (simpul)", amount: 1, unit: "lembar" },

                { name: "Daun jeruk purut", amount: 6, unit: "lembar" },

            ],
            steps: [
                "Haluskan semua bahan Bumbu Halus, campurkan dengan ketumbar, jintan, dan pala bubuk.",
                "Balurkan bumbu halus ke seluruh potongan daging sapi hingga rata dalam wajan.",
                "Tuangkan santan encer. Masukkan serai, daun kunyit, daun jeruk, cengkeh, kapulaga, bunga lawang, kayu manis, dan asam kandis.",

        {

                { name: "Jahe", amount: 2, unit: "cm" },
                { name: "Kemiri sangrai", amount: 3, unit: "butir" }
            ],
            bumbuRempah: [
                { name: "Bubuk kari khas Aceh", amount: 1, unit: "sdm" },
                { name: "Ketumbar sangrai", amount: 1, unit: "sdt" },
                { name: "Jintan sangrai", amount: 0.5, unit: "sdt" },
                { name: "Kapulaga (haluskan isinya)", amount: 2, unit: "butir" },
                { name: "Adas manis", amount: 0.25, unit: "sdt" },
                { name: "Kecap manis", amount: 2, unit: "sdm" },
                { name: "Kecap asin", amount: 1, unit: "sdm" },
                { name: "Bawang merah irisan (tumisan)", amount: 3, unit: "siung" },
                { name: "Emping goreng & Acar timun bawang", amount: 1, unit: "porsi" }
            ],
            steps: [
                "Tumis irisan bawang merah sampai harum, lalu masukkan Bumbu Halus dan racikan rempah (bubuk kari, ketumbar, jintan, adas manis, kapulaga).",
                "Tumis hingga bumbu matang dan beraroma rempah harum pekat.",
                "Masukkan irisan daging sapi/udang, aduk hingga berubah warna.",
                "Tuangkan air kaldu sapi, tambahkan kecap manis dan kecap asin.",
                "Masukkan mie kuning basah, kol, dan tauge. Masak sebentar hingga kuah mengental nyemek.",

            ]
        },
        {
            id: 3,
            name: "Rawon Daging Sapi Kluwek Pekat",
            region: "Jawa (Jawa Timur)",
            group: "Jawa",
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Rawon_Setan.jpg/640px-Rawon_Setan.jpg",

            difficulty: "Sedang",
            basePortion: 4,
            mainIngredients: [
                { name: "Daging sapi sandung lamur / tetelan", amount: 500, unit: "g" },
                { name: "Air bersih kaldu", amount: 1800, unit: "ml" },

            ],
            bumbuHalus: [

            ],
            bumbuRempah: [

                { name: "Jintan sangrai", amount: 0.5, unit: "sdt" },
                { name: "Serai (geprek)", amount: 2, unit: "batang" },
                { name: "Daun jeruk purut", amount: 5, unit: "lembar" },
                { name: "Lengkuas (geprek)", amount: 3, unit: "cm" },
                { name: "Daun salam", amount: 3, unit: "lembar" },

                { name: "Pelengkap: Tauge pendek, Telur asin, Sambal terasi", amount: 1, unit: "porsi" }
            ],
            steps: [
                "Rebus daging sapi dalam air mendidih hingga empuk, potong dadu. Saring air kaldunya.",
                "Haluskan isi kluwek bersama Bumbu Halus, ketumbar, dan jintan sangrai sampai benar-benar lembut pekat.",
                "Tumis bumbu halus bersama serai, lengkuas, daun jeruk, dan daun salam hingga matang dan harum.",
                "Tuangkan tumisan bumbu ke dalam panci kuah kaldu rebusan daging.",
                "Masukkan irisan daun bawang, gula jawa, dan garam. Masak dengan api kecil agar bumbu kluwek meresap ke serat daging.",
                "Sajikan di mangkuk dengan tauge pendek segar, telur asin, dan sambal terasi."
            ]
        },
        {
            id: 4,
            name: "Coto Makassar Rempah 40",
            region: "Sulawesi (Sulsel)",
            group: "Sulawesi",
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Coto_makassar.jpg/640px-Coto_makassar.jpg",
            time: "90 Menit",
            difficulty: "Sedang",
            basePortion: 4,
            mainIngredients: [
                { name: "Daging sapi & jeroan (babat/paru)", amount: 500, unit: "g" },
                { name: "Air cucian beras putih ke-2 (tajin)", amount: 1800, unit: "ml" },
                { name: "Kacang tanah goreng (haluskan pekat)", amount: 150, unit: "g" }
            ],
            bumbuHalus: [
                { name: "Bawang merah", amount: 12, unit: "siung" },
                { name: "Bawang putih", amount: 8, unit: "siung" },
                { name: "Cabai merah besar", amount: 3, unit: "buah" },
                { name: "Kemiri sangrai", amount: 6, unit: "butir" },
                { name: "Lengkuas muda", amount: 4, unit: "cm" },
                { name: "Jahe", amount: 3, unit: "cm" }
            ],
            bumbuRempah: [
                { name: "Ketumbar sangrai", amount: 1.5, unit: "sdm" },
                { name: "Jintan sangrai", amount: 1, unit: "sdt" },
                { name: "Merica butir", amount: 1, unit: "sdt" },
                { name: "Pala bubuk", amount: 0.5, unit: "sdt" },
                { name: "Kayu manis", amount: 3, unit: "cm" },
                { name: "Cengkeh", amount: 3, unit: "butir" },
                { name: "Serai (geprek)", amount: 3, unit: "batang" },
                { name: "Daun salam", amount: 4, unit: "lembar" },
                { name: "Ketupat daun kelapa & Sambal taoco", amount: 1, unit: "porsi" }
            ],
            steps: [
                "Rebus daging dan jeroan menggunakan air cucian beras (tajin) bersama serai, kayu manis, cengkeh, dan daun salam hingga empuk.",
                "Angkat daging, potong dadu kecil. Saring air rebusan kaldunya.",
                "Haluskan Bumbu Halus bersama ketumbar, jintan, merica, dan pala sangrai.",
                "Tumis bumbu halus hingga harum dan matang berminyak, masukkan ke dalam air kaldu rebusan.",
                "Masukkan kacang tanah goreng halus, aduk rata hingga kuah berubah gurih, agak kental, dan beraroma harum rempah.",
                "Sajikan di mangkuk bersama potongan ketupat, irisan daun bawang, perasan jeruk nipis, dan sambal taoco."
            ]
        }
    ];

    let currentServings = 4;
    let selectedRecipe = null;

    function renderRecipes() {
        const grid = document.getElementById('recipeGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const selectedGroup = document.getElementById('regionSelect').value;
        grid.innerHTML = '';

        const filtered = recipes.filter(r => {
            const matchesSearch = r.name.toLowerCase().includes(search) || r.region.toLowerCase().includes(search);
            const matchesGroup = selectedGroup === 'semua' || r.group === selectedGroup;
            return matchesSearch && matchesGroup;
        });

        document.getElementById('counterBadge').innerText = `Menampilkan ${filtered.length} Resep Terverifikasi`;

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 32px 0;">Menu tidak ditemukan.</p>`;
            return;
        }

        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openDetail(r.id);
            card.innerHTML = `
                <img class="card-img" src="${r.image}" alt="${r.name}" loading="lazy">
                <div class="card-body">
                    <span class="card-region">${r.region}</span>
                    <h3 class="card-title">${r.name}</h3>
                    <div class="card-meta">
                        <span>⏱️ ${r.time}</span>
                        <span>📊 ${r.difficulty}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetail(id) {
        selectedRecipe = recipes.find(r => r.id === id);
        currentServings = selectedRecipe.basePortion;
        
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        
        renderDetailContent();
    }

    function closeDetail() {
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
        selectedRecipe = null;
    }

    function updateServings(delta) {
        const newServings = currentServings + delta;
        if (newServings >= 1 && newServings <= 10) {
            currentServings = newServings;
            renderDetailContent();
        }
    }

    function renderDetailContent() {
        if (!selectedRecipe) return;

        const ratio = currentServings / selectedRecipe.basePortion;
        const container = document.getElementById('recipeDetail');

        const mapIngredient = (ing) => {
            const adjustedAmount = (ing.amount * ratio).toLocaleString('id-ID', { maximumFractionDigits: 1 });
            return `<li><strong>${adjustedAmount} ${ing.unit}</strong> ${ing.name}</li>`;
        };

        const mainIngHTML = selectedRecipe.mainIngredients.map(mapIngredient).join('');
        const bumbuHalusHTML = selectedRecipe.bumbuHalus.map(mapIngredient).join('');
        const bumbuRempahHTML = selectedRecipe.bumbuRempah.map(mapIngredient).join('');

        const stepsHTML = selectedRecipe.steps.map(step => {
            return `<li onclick="this.classList.toggle('done')">${step}</li>`;
        }).join('');

        container.innerHTML = `
            <span class="card-region">${selectedRecipe.region}</span>
            <h2 style="font-size: 1.5rem; font-weight: 800; margin-top: 4px;">${selectedRecipe.name}</h2>
            
            <img class="detail-img" src="${selectedRecipe.image}" alt="${selectedRecipe.name}">

            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Estimasi Waktu: ${selectedRecipe.time} | Tingkat Kesulitan: ${selectedRecipe.difficulty}</p>

            <div class="portion-selector">
                <span style="font-size: 0.85rem; font-weight: 700;">Takaran Porsi:</span>
                <button class="portion-btn" onclick="updateServings(-1)">-</button>
                <span style="font-weight: 800; min-width: 20px; text-align: center;">${currentServings}</span>
                <button class="portion-btn" onclick="updateServings(1)">+</button>
            </div>

            <h3 class="section-title">1. Bahan Utama</h3>
            <ul class="ingredients-list">${mainIngHTML}</ul>

            <h3 class="section-title">2. Bumbu Halus (Ulek / Blender)</h3>
            <ul class="ingredients-list">${bumbuHalusHTML}</ul>

            <h3 class="section-title">3. Racikan Rempah Kering & Aromatik</h3>
            <ul class="ingredients-list">${bumbuRempahHTML}</ul>

            <h3 class="section-title">Langkah Memasak</h3>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom: 12px;">*Klik langkah untuk menandai selesai.</p>
            <ol class="steps-list">${stepsHTML}</ol>
        `;
    }

    renderRecipes();
</script>
</body>
</html>
