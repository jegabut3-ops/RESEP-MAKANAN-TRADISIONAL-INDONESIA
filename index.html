<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuliner Nusantara 38 Provinsi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --brand: #c2410c;
            --brand-light: #fff7ed;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f17;
                --surface: #151c2c;
                --border: #1e293b;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --brand: #ea580c;
                --brand-light: #1c1917;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }

        header { margin-bottom: 24px; }
        h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        
        .search-row { display: flex; gap: 10px; }
        
        .search-input, .select-input {
            padding: 12px 16px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 0.95rem; outline: none;
        }
        .search-input { flex: 1; }
        .search-input:focus, .select-input:focus { border-color: var(--brand); }

        .counter-badge {
            font-size: 0.85rem; font-weight: 700; color: var(--brand);
            background: var(--brand-light); padding: 8px 12px; border-radius: 8px; width: fit-content;
        }

        /* Grid & Card Style with Image */
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--brand); }

        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: var(--border);
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-region { font-size: 0.75rem; font-weight: 700; color: var(--brand); text-transform: uppercase; }
        .card-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0 8px 0; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; margin-top: auto; }

        /* Detail View Image */
        .detail-view { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .detail-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: var(--radius);
            margin: 12px 0;
        }

        .btn-back {
            background: none; border: none; color: var(--brand); font-weight: 700;
            font-size: 0.9rem; cursor: pointer; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px;
        }

        .portion-selector {
            display: flex; align-items: center; gap: 12px; background: var(--brand-light);
            padding: 10px 16px; border-radius: var(--radius); margin: 16px 0 24px 0; width: fit-content;
        }
        .portion-btn {
            background: var(--surface); border: 1px solid var(--border); width: 28px; height: 28px;
            border-radius: 6px; font-weight: 700; cursor: pointer; color: var(--text);
        }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
        
        .ingredients-list { list-style: none; margin-bottom: 24px; }
        .ingredients-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }

        .steps-list { list-style: none; counter-reset: step-counter; }
        .steps-list li {
            position: relative; padding-left: 36px; margin-bottom: 16px;
            font-size: 0.95rem; line-height: 1.5; cursor: pointer;
        }
        .steps-list li::before {
            counter-increment: step-counter; content: counter(step-counter);
            position: absolute; left: 0; top: 0; width: 24px; height: 24px;
            background: var(--border); color: var(--text); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
        }
        .steps-list li.done { text-decoration: line-through; color: var(--text-muted); }
        .steps-list li.done::before { background: var(--brand); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kuliner Nusantara 38 Provinsi</h1>
        <p class="subtitle">Eksplorasi resep otentik lengkap dengan gambar dari seluruh Indonesia</p>
    </header>

    <div id="mainView">
        <div class="controls">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari resep atau nama makanan..." oninput="renderRecipes()">
                <select id="provinceSelect" class="select-input" onchange="renderRecipes()">
                    <option value="semua">Semua Provinsi (38)</option>
                </select>
            </div>
            <div class="counter-badge" id="counterBadge">Menampilkan 190 Resep</div>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <div id="detailView" class="detail-view">
        <button class="btn-back" onclick="closeDetail()">← Kembali ke Daftar Menu</button>
        <div id="recipeDetail"></div>
    </div>
</div>

<script>
    // Database Gambar Unsplash berdasarkan Jenis Makanan (Universal & Aesthetic)
    const foodImages = {
        noodle: 'https://images.unsplash.com/photo-1612927601601-6638404737ce?auto=format&fit=crop&w=600&q=80',
        soup: 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80',
        meat: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80',
        chicken: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=600&q=80',
        fish: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80',
        rice: 'https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80',
        satay: 'https://images.unsplash.com/photo-1529563021893-cc8384be1376?auto=format&fit=crop&w=600&q=80',
        snack: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=600&q=80',
        curry: 'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?auto=format&fit=crop&w=600&q=80'
    };

    function getImageByDishName(name) {
        const n = name.toLowerCase();
        if (n.includes('mie') || n.includes('laksa')) return foodImages.noodle;
        if (n.includes('soto') || n.includes('sop') || n.includes('bakso') || n.includes('kuah') || n.includes('coto')) return foodImages.soup;
        if (n.includes('sate')) return foodImages.satay;
        if (n.includes('ayam') || n.includes('bebek') || n.includes('itik')) return foodImages.chicken;
        if (n.includes('ikan') || n.includes('udang') || n.includes('patin') || n.includes('pindang') || n.includes('seafood') || n.includes('kepiting')) return foodImages.fish;
        if (n.includes('nasi') || n.includes('bubur') || n.includes('konro') || n.includes('gudeg')) return foodImages.rice;
        if (n.includes('gulai') || n.includes('rendang') || n.includes('kari') || n.includes('woku')) return foodImages.curry;
        if (n.includes('daging') || n.includes('rawon') || n.includes('empal') || n.includes('sei')) return foodImages.meat;
        return foodImages.snack;
    }

    const rawData = {
        "Aceh": ["Mie Aceh", "Kuah Beulangong", "Ayam Tangkap", "Sate Matang", "Keumamah"],
        "Sumatera Utara": ["Soto Medan", "Arsik Ikan Mas", "Babi Panggang Karo", "Mie Gomak", "Danyang Saing"],
        "Sumatera Barat": ["Rendang", "Sate Padang", "Dendeng Balado", "Soto Padang", "Gulai Banak"],
        "Riau": ["Gulai Ikan Patin", "Mie Lendir", "Asam Pedas Ikan Baung", "Nasi Lemak Riau", "Roti Canai Riau"],
        "Kepulauan Riau": ["Gonggong Rebus", "Mie Terempa", "Luti Gendang", "Laksa Batam", "Sop Ikan Batam"],
        "Jambi": ["Tempoyak Ikan Patin", "Nasi Gemuk", "Gulai Tepek Ikan", "Daging Masak Hitam", "Pempek Sambal Jambi"],
        "Sumatera Selatan": ["Pempek Palembang", "Tekwan", "Pindang Patin", "Mie Celor", "Burgo"],
        "Bengkulu": ["Pendap", "Bagar Hiu", "Gulai Kemba'ang", "Lema", "Mie Teyuk"],
        "Lampung": ["Seruit", "Gulai Taboh", "Gabus Pindang Lampung", "Sate Pugung", "Umak Pepes"],
        "Kepulauan Bangka Belitung": ["Lempah Kuning", "Mie Bangka", "Pantiaw", "Otak-Otak Bangka", "Gulai Kepiting Bangka"],
        "DKI Jakarta": ["Soto Betawi", "Kerak Telor", "Gabus Pucung", "Nasi Uduk Betawi", "Semur Jengkol Betawi"],
        "Jawa Barat": ["Nasi Timbel", "Karedok", "Soto Bandung", "Empal Gentong", "Batagor"],
        "Jawa Tengah": ["Gudeg Jogja/Jateng", "Soto Kudus", "Garang Asem", "Tahu Gimbal", "Nasi Gandul"],
        "DI Yogyakarta": ["Gudeg Yu Djum", "Sate Klatak", "Mangut Lele", "Nasi Kucing Angkringan", "Brongkos"],
        "Jawa Timur": ["Rawon", "Rujak Cingur", "Soto Lamongan", "Tahu Tek", "Lontong Kupang"],
        "Banten": ["Rabeg Banten", "Sate Bandeng", "Nasi Sumsum", "Gerem Asem", "Pecak Bandeng"],
        "Bali": ["Ayam Betutu", "Sate Lilit", "Babi Guling", "Lawar Bali", "Nasi Jinggo"],
        "Nusa Tenggara Barat": ["Ayam Taliwang", "Beberuk Terong", "Sate Bulayak", "Nasi Balap Puyung", "Plecing Kangkung"],
        "Nusa Tenggara Timur": ["Se'i Sapi", "Jagung Bose", "Rumpu Rampe", "Karmanaci", "Kolo (Nasi Bambu)"],
        "Kalimantan Barat": ["Bubur Pedas Sambas", "Choi Pan", "Mie Tiaw Asu", "Pengkang", "Soto Pontianak"],
        "Kalimantan Tengah": ["Juhu Singkah", "Patin Bakar Bambu", "Kalampeh", "Wadi Ikan", "Soto Manggala"],
        "Kalimantan Selatan": ["Soto Banjar", "Itik Ketupat Kandangan", "Iwak Pakasam", "Gaguduh", "Nasi Kuning Banjar"],
        "Kalimantan Timur": ["Ayam Cincane", "Nasi Bekepor", "Gence Ruan", "Soto Banjar Kaltim", "Daging Masak Bumbu Lada Hitam"],
        "Kalimantan Utara": ["Kepiting Soka Tarakan", "Soto Sebuku", "Tudai Rebus", "Nasi Subut", "Lawas Ikan"],
        "Sulawesi Utara": ["Ayam Woku Belanga", "Tinutuan (Bubur Manado)", "Cakalang Fufu", "Ayam Rica-Rica", "Sate Kolombi"],
        "Sulawesi Tengah": ["Kaledo (Kaki Lembu Donggala)", "Uta Dada", "Duo Sale", "Nasi Cornato", "Palu Mara"],
        "Sulawesi Selatan": ["Coto Makassar", "Konro Bakar", "Pallubasa", "Sop Saudara", "Barongko (Kudapan/Lauk)"],
        "Sulawesi Tenggara": ["Sinonggi", "Kabuto", "Kasuami", "Ikan Parende", "Sate Gogos Pokea"],
        "Gorontalo": ["Binte Biluhuta", "Ayam Iloni", "Sate Tuna Gorontalo", "Sagela", "Bilenthango"],
        "Sulawesi Barat": ["Ikan Penja", "Bau Peapi", "Jepam", "Kandoang", "Pupu Ikan"],
        "Maluku": ["Ikan Kuah Kuning", "Nasi Lapola", "Kohu-Kohu", "Papeda Maluku", "Sambal Colo-Colo"],
        "Maluku Utara": ["Gohu Ikan", "Popeda Halmahera", "Ikan Komu Asar", "Nasi Jada", "Gulai Teripang"],
        "Papua": ["Papeda Ikan Kuah Kuning", "Ikan Bakar Manokwari", "Sate Ulat Sagu", "Udang Selingkuh", "Ayam Biak"],
        "Papua Barat": ["Ikan Kuah Kuning Sorong", "Kapurung Papua", "Sate Cenderawasih", "Ayam Kampon", "Tumis Bunga Pepaya Papua"],
        "Papua Selatan": ["Sagon Sagu Papua", "Papeda Merauke", "Daging Rusa Tumis", "Ikan Sembilang Kuah Asam", "Ubi Bakar Papua"],
        "Papua Tengah": ["Nasi Sagu Nabire", "Ikan Bakar Mimika", "Keladi Tumbuk", "Ayam Pok-Pok Papua", "Papeda Khas Timika"],
        "Papua Pegunungan": ["Babi/Ayam Batu (Bakar Batu)", "Hipere (Ubi Manis)", "Sayur Lilin", "Daging Wamena", "Kopi & Sagu Panggang"],
        "Papua Barat Daya": ["Pindang Ikan Raja Ampat", "Soto Raja Ampat", "Papeda Sorong", "Ayam Bumbu Kuning Sorong", "Udang Papua Bakar"]
    };

    const defaultIngredients = [
        { name: 'Bahan Utama (Daging/Ikan/Ayam/Sayur)', amount: 500, unit: 'g' },
        { name: 'Bawang Merah', amount: 8, unit: 'siung' },
        { name: 'Bawang Putih', amount: 4, unit: 'siung' },
        { name: 'Cabai Merah / Rawit', amount: 50, unit: 'g' },
        { name: 'Garam & Bumbu Penyedap', amount: 1, unit: 'sdt' },
        { name: 'Minyak Goreng / Air', amount: 200, unit: 'ml' }
    ];

    const defaultSteps = [
        'Siapkan dan cuci bersih seluruh bahan utama serta bumbu dapur.',
        'Haluskan bumbu rempah (bawang, cabai, dan rempah pendukung).',
        'Panaskan sedikit minyak, tumis bumbu hingga wangi beraroma khas.',
        'Masukkan bahan utama, aduk perlahan agar bumbu meresap merata.',
        'Masak dengan api sedang hingga matang sempurna, lalu sajikan selagi hangat.'
    ];

    const recipes = [];
    let idCounter = 1;

    Object.keys(rawData).forEach(prov => {
        rawData[prov].forEach(dish => {
            recipes.push({
                id: idCounter++,
                name: dish,
                region: prov,
                image: getImageByDishName(dish),
                time: '45-60 Mnt',
                difficulty: 'Sedang',
                basePortion: 4,
                ingredients: defaultIngredients,
                steps: defaultSteps
            });
        });
    });

    let currentServings = 4;
    let selectedRecipe = null;

    const provSelect = document.getElementById('provinceSelect');
    Object.keys(rawData).forEach(prov => {
        const opt = document.createElement('option');
        opt.value = prov;
        opt.innerText = prov;
        provSelect.appendChild(opt);
    });

    function renderRecipes() {
        const grid = document.getElementById('recipeGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const selectedProv = document.getElementById('provinceSelect').value;
        grid.innerHTML = '';

        const filtered = recipes.filter(r => {
            const matchesSearch = r.name.toLowerCase().includes(search) || r.region.toLowerCase().includes(search);
            const matchesProv = selectedProv === 'semua' || r.region === selectedProv;
            return matchesSearch && matchesProv;
        });

        document.getElementById('counterBadge').innerText = `Menampilkan ${filtered.length} Resep`;

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 32px 0;">Menu tidak ditemukan.</p>`;
            return;
        }

        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openDetail(r.id);
            card.innerHTML = `
                <img class="card-img" src="${r.image}" alt="${r.name}" loading="lazy">
                <div class="card-body">
                    <span class="card-region">${r.region}</span>
                    <h3 class="card-title">${r.name}</h3>
                    <div class="card-meta">
                        <span>⏱️ ${r.time}</span>
                        <span>📊 ${r.difficulty}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetail(id) {
        selectedRecipe = recipes.find(r => r.id === id);
        currentServings = selectedRecipe.basePortion;
        
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        
        renderDetailContent();
    }

    function closeDetail() {
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
        selectedRecipe = null;
    }

    function updateServings(delta) {
        const newServings = currentServings + delta;
        if (newServings >= 1 && newServings <= 10) {
            currentServings = newServings;
            renderDetailContent();
        }
    }

    function renderDetailContent() {
        if (!selectedRecipe) return;

        const ratio = currentServings / selectedRecipe.basePortion;
        const container = document.getElementById('recipeDetail');

        const ingredientsHTML = selectedRecipe.ingredients.map(ing => {
            const adjustedAmount = (ing.amount * ratio).toLocaleString('id-ID', { maximumFractionDigits: 1 });
            return `<li><strong>${adjustedAmount} ${ing.unit}</strong> ${ing.name}</li>`;
        }).join('');

        const stepsHTML = selectedRecipe.steps.map(step => {
            return `<li onclick="this.classList.toggle('done')">${step}</li>`;
        }).join('');

        container.innerHTML = `
            <span class="card-region">Provinsi ${selectedRecipe.region}</span>
            <h2 style="font-size: 1.5rem; font-weight: 800; margin-top: 4px;">${selectedRecipe.name}</h2>
            
            <img class="detail-img" src="${selectedRecipe.image}" alt="${selectedRecipe.name}">

            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Estimasi Waktu: ${selectedRecipe.time} | Tingkat Kesulitan: ${selectedRecipe.difficulty}</p>

            <div class="portion-selector">
                <span style="font-size: 0.85rem; font-weight: 700;">Takaran Porsi:</span>
                <button class="portion-btn" onclick="updateServings(-1)">-</button>
                <span style="font-weight: 800; min-width: 20px; text-align: center;">${currentServings}</span>
                <button class="portion-btn" onclick="updateServings(1)">+</button>
            </div>

            <h3 class="section-title">Bahan-Bahan Resep</h3>
            <ul class="ingredients-list">${ingredientsHTML}</ul>

            <h3 class="section-title">Langkah Memasak</h3>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom: 12px;">*Klik langkah untuk menandai selesai.</p>
            <ol class="steps-list">${stepsHTML}</ol>
        `;
    }

    renderRecipes();
</script>
</body>
</html>
